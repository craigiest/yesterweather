<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fc0"/>
      <stop offset="1" stop-color="#7db4ea"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef5a4f"/>
      <stop offset="1" stop-color="#d63a30"/>
    </linearGradient>
    <linearGradient id="flap" x1="832" y1="608" x2="640" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cfd6de"/>
      <stop offset="0.55" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="1" stop-color="#ffefc4"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b2a55" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="pageArea">
      <path d="M192 360 H832 V784 Q832 848 768 848 H256 Q192 848 192 784 Z"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- calendar body -->
  <g filter="url(#drop)">
    <path d="M256 224 H768 Q832 224 832 288 V784 Q832 848 768 848 H256 Q192 848 192 784 V288 Q192 224 256 224 Z" fill="#ffffff"/>
  </g>

  <g clip-path="url(#pageArea)">
    <!-- the page underneath: today's sun -->
    <rect x="192" y="360" width="640" height="488" fill="url(#under)"/>
    <g transform="translate(770 792)">
      <g stroke="#f5a300" stroke-width="16" stroke-linecap="round">
        <line x1="0" y1="-74" x2="0" y2="-100"/>
        <line x1="52" y1="-52" x2="71" y2="-71"/>
        <line x1="74" y1="0" x2="100" y2="0"/>
        <line x1="52" y1="52" x2="71" y2="71"/>
        <line x1="0" y1="74" x2="0" y2="100"/>
        <line x1="-52" y1="52" x2="-71" y2="71"/>
        <line x1="-74" y1="0" x2="-100" y2="0"/>
        <line x1="-52" y1="-52" x2="-71" y2="-71"/>
      </g>
      <circle r="54" fill="#ffbf1f"/>
    </g>

    <!-- yesterday's page, with its lower-right corner lifted -->
    <path d="M192 360 H832 V608 L592 848 H192 Z" fill="#ffffff"/>
  </g>
  <!-- shadow cast by the lifted corner onto yesterday's page -->
  <g clip-path="url(#pageArea)">
    <path d="M832 608 Q748 628 668 648 Q626 660 618 704 Q606 776 592 848 Z" transform="translate(-16 22)" fill="#1d3557" opacity="0.30" filter="url(#soft)"/>
  </g>

  <!-- rain icon on yesterday's page -->
  <g transform="translate(470 560)">
    <path d="M-150 40 Q-200 40 -200 -8 Q-200 -58 -146 -60 Q-136 -128 -64 -136 Q-6 -140 26 -96 Q50 -116 84 -110 Q138 -100 142 -46 Q196 -40 196 0 Q196 40 150 40 Z" fill="#8fa6be"/>
    <g stroke="#2f80e0" stroke-width="20" stroke-linecap="round">
      <line x1="-112" y1="84" x2="-130" y2="128"/>
      <line x1="-36" y1="84" x2="-54" y2="128"/>
      <line x1="40" y1="84" x2="22" y2="128"/>
      <line x1="116" y1="84" x2="98" y2="128"/>
      <line x1="-74" y1="152" x2="-88" y2="186"/>
      <line x1="2" y1="152" x2="-12" y2="186"/>
      <line x1="78" y1="152" x2="64" y2="186"/>
    </g>
  </g>

  <!-- the lifted corner (back of the page), curling up toward the viewer -->
  <path d="M832 608 Q748 628 668 648 Q626 660 618 704 Q606 776 592 848 Z" fill="url(#flap)"/>
  <path d="M832 608 Q748 628 668 648 Q626 660 618 704 Q606 776 592 848" fill="none" stroke="#b8c2cc" stroke-width="3"/>

  <!-- red header bar -->
  <path d="M256 224 H768 Q832 224 832 288 V360 H192 V288 Q192 224 256 224 Z" fill="url(#header)"/>
  <rect x="192" y="352" width="640" height="10" fill="#000000" opacity="0.10"/>

  <!-- binding rings -->
  <g fill="#3b4250">
    <rect x="322" y="176" width="44" height="120" rx="22"/>
    <rect x="658" y="176" width="44" height="120" rx="22"/>
  </g>
  <g fill="#9a2a22" opacity="0.35">
    <ellipse cx="344" cy="300" rx="26" ry="12"/>
    <ellipse cx="680" cy="300" rx="26" ry="12"/>
  </g>
</svg>
