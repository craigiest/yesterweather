<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Pull-off calendar filling the icon: red header, yesterday's rain page peeled back to reveal today's sun. -->
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f05a4f"/>
      <stop offset="1" stop-color="#d93b31"/>
    </linearGradient>
    <!-- back of the turned page: darker at the fold, lighter toward the curl -->
    <linearGradient id="flap" x1="300" y1="530" x2="200" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cdd4dc"/>
      <stop offset="0.6" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="page"><rect x="0" y="230" width="1024" height="794"/></clipPath>
  </defs>

  <!-- today's page underneath, with the sun centered -->
  <rect width="1024" height="1024" fill="#ffffff"/>
  <g transform="translate(512 627)">
    <g stroke="#f5a300" stroke-width="30" stroke-linecap="round">
      <line x1="0" y1="-150" x2="0" y2="-200"/>
      <line x1="106" y1="-106" x2="141" y2="-141"/>
      <line x1="150" y1="0" x2="200" y2="0"/>
      <line x1="106" y1="106" x2="141" y2="141"/>
      <line x1="0" y1="150" x2="0" y2="200"/>
      <line x1="-106" y1="106" x2="-141" y2="141"/>
      <line x1="-150" y1="0" x2="-200" y2="0"/>
      <line x1="-106" y1="-106" x2="-141" y2="-141"/>
    </g>
    <circle r="112" fill="#ffbf1f"/>
  </g>

  <g clip-path="url(#page)">
    <!-- what's left of yesterday's page lying flat (upper-left of the fold) -->
    <path d="M0 230 H600 L0 830 Z" fill="#ffffff"/>
    <!-- rain icon on yesterday's page; most of it went with the turned part -->
    <clipPath id="flat"><path d="M0 230 H600 L0 830 Z"/></clipPath>
    <g clip-path="url(#flat)"><g transform="translate(250 420) scale(1.05)">
      <path d="M-150 40 Q-200 40 -200 -8 Q-200 -58 -146 -60 Q-136 -128 -64 -136 Q-6 -140 26 -96 Q50 -116 84 -110 Q138 -100 142 -46 Q196 -40 196 0 Q196 40 150 40 Z" fill="#8fa6be"/>
      <g stroke="#2f80e0" stroke-width="20" stroke-linecap="round">
        <line x1="-112" y1="84" x2="-130" y2="128"/>
        <line x1="-36" y1="84" x2="-54" y2="128"/>
        <line x1="40" y1="84" x2="22" y2="128"/>
      </g>
    </g></g>
    <!-- shadow of the lifted page falling across the fold -->
    <path d="M600 230 C480 262 350 318 290 400 C220 500 70 690 0 830 Z" transform="translate(26 30)" fill="#1d3557" opacity="0.32" filter="url(#soft)"/>
    <!-- the turned page, curling up toward the viewer -->
    <path d="M600 230 C480 262 350 318 290 400 C220 500 70 690 0 830 Z" fill="url(#flap)"/>
    <path d="M600 230 C480 262 350 318 290 400 C220 500 70 690 0 830" fill="none" stroke="#b9c3cd" stroke-width="4"/>
  </g>

  <!-- red header bar -->
  <rect width="1024" height="230" fill="url(#header)"/>
  <rect y="222" width="1024" height="14" fill="#000000" opacity="0.12"/>
</svg>
